name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # python-nmap itself isn't needed to run the tests (they mock the
          # network calls), and the nmap system binary isn't available in
          # this runner anyway -- install everything else.
          pip install networkx matplotlib requests jinja2 pyvis flask pytest

      - name: Run tests
        run: pytest tests/ -v
