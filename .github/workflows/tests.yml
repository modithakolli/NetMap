name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # python-nmap itself isn't needed to run the tests (they mock the
          # network calls), and the nmap system binary isn't available in
          # this runner anyway -- install everything else.
          pip install networkx matplotlib requests jinja2 pyvis flask pytest

      - name: Run tests
        run: pytest tests/ -v

  security:
    name: security-scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: python -m pip install bandit pip-audit

      - name: SAST (bandit, medium severity and above)
        run: bandit -r . -x ./tests,./lib,./.git -ll

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Secrets detection (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t netmap .
